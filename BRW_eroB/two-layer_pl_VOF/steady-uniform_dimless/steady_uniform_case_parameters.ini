# Dimensionless steady-uniform relaxation benchmark for the uploaded
# three-phase two-layer power-law Basilisk solver.
#
# Reference scales:
#   length H_l; velocity U_l; time H_l/U_l; pressure rho_l U_l^2;
#   dynamic viscosity rho_l U_l H_l.

[physical_problem]
froude_lower = 0.20
slope_tan = 0.06
depth_ratio = 1.0
density_ratio = 0.8
consistency_ratio = 1.00

air_density_ratio = 0.012
upper_to_air_dynamic_viscosity_ratio = 67.0
air_streamwise_gravity = false

# The interfaces remain flat in this benchmark, so capillarity is disabled.
sigma_internal_star = 0.0
sigma_free_star = 0.0

[lower_rheology]
model = smooth_power_law
power_index = 1.00
epsilon = 5.0e-4
yield_stress_star = 0.0
papanastasiou_m_star = 0.0
eta_min = 0.0
eta_max = 25.0
gamma_floor = 1.0e-8

[upper_rheology]
model = smooth_power_law
power_index = 1.00
epsilon = 5.0e-4
yield_stress_star = 0.0
papanastasiou_m_star = 0.0
eta_min = 0.0
eta_max = 25.0
gamma_floor = 1.0e-8

[domain_and_mesh]
# Lx = 4 H_l is twice the total liquid depth (H_l + H_u = 2 H_l).
# The square quadtree domain is truncated by a free-slip embedded ceiling.
lx = 4.0
nominal_ceiling = 3.5

# Equal levels deliberately create a stationary uniform quadtree mesh.
# Level 6 gives Delta*=4/64=0.0625 and 16 cells through each liquid layer.
max_level = 6
min_level = 6
initial_level = 6
ceiling_fine_fraction = 1.0
ceiling_level_drop = 0
initial_adapt_passes = 0
interface_padding = 1
interface_epsilon = 1.0e-8

[time_integration]
end_time = 20.0
max_dt = 2.0e-2
cfl = 0.475
solver_tolerance = 1.0e-8
solver_nitermax = 512

[initial_condition]
# The interfaces are flat. The complete fluid domain starts from a small,
# uniform streamwise velocity and zero vertical velocity.
perturbation_mode = 1
tracked_mode = 1
perturbation_phase = 0.0
velocity_amplitude = 0.0
lower_depth_amplitude = 0.0
upper_depth_amplitude = 0.0
pressure_mode = 0
initial_audit_warning_tolerance = 1.0e-10

[steady_uniform]
initial_uniform_velocity = 0.02
# Text profiles and quantitative comparisons are written at t*=0,1,2,...
comparison_output_dt = 1.0
# The default run continues to end_time. Set true to stop after the tolerance
# is met for convergence_hold_outputs successive comparison outputs.
stop_when_converged = false
convergence_relative_rms = 2.0e-3
convergence_hold_outputs = 4

[adaptation]
# Retained because the common generator expects these entries. They are not
# used by the stationary-mesh benchmark driver.
u_error_lower = 0.50
v_error_lower = 0.25
u_error_air = 1.50
v_error_air = 1.00
vorticity_error = 0.20
shear_error = 0.20

[output]
# output_dt is retained for the common generated header. The benchmark uses
# [steady_uniform] comparison_output_dt for text output.
output_dt = 1.0
gfs_dt = 1000.0
dump_dt = 1000.0
enable_dump_output = false
wave_amplitude_every = 100

[profile_sampling]
lower_samples = 401
upper_samples = 401
air_samples = 301
integration_points = 4001

[dimensional_reference]
enabled = false
gravity_m_s2 = 9.81
lower_depth_m = 0.025
lower_density_kg_m3 = 1500.0
