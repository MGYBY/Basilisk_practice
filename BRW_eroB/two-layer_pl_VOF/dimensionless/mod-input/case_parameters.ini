# Dimensionless three-phase two-layer power-law roll-wave case
#
# Reference scales:
#   length H_l; velocity U_l; time H_l/U_l; pressure rho_l U_l^2;
#   dynamic viscosity rho_l U_l H_l.
#
# The default set maps the uploaded dimensional case to dimensionless units.
# The former hard viscosity caps are represented by the smooth low-shear
# plateaus used in the latest audited report.

[physical_problem]
froude_lower = 0.60
slope_tan = 0.06
depth_ratio = 1.0
density_ratio = 0.8
consistency_ratio = 1.00

air_density_ratio = 0.015
# R_mu,u/a = eta_u(gamma*=1)/eta_a; gamma*=1 represents U_l/H_l.
# The generator evaluates eta_u with the complete upper rheology and derives
# eta_a. This default ratio preserves the former eta_a=0.014.
upper_to_air_dynamic_viscosity_ratio = 13.481006434861493
air_streamwise_gravity = false

# sigma_star = sigma/(rho_l U_l^2 H_l) = 1/We.
# Set both to zero to match the no-capillarity stability report.
sigma_internal_star = 1.0e-2
sigma_free_star = 1.0e-2

[lower_rheology]
# Available models: smooth_power_law, bounded_power_law,
# papanastasiou_hb, bounded_hb.
model = smooth_power_law
power_index = 0.4
epsilon = 5.0e-4
yield_stress_star = 0.0
papanastasiou_m_star = 0.0
eta_min = 0.0
eta_max = 25.0
gamma_floor = 1.0e-8

[upper_rheology]
model = smooth_power_law
power_index = 0.8
epsilon = 5.0e-4
yield_stress_star = 0.0
papanastasiou_m_star = 0.0
eta_min = 0.0
eta_max = 25.0
gamma_floor = 1.0e-8

[domain_and_mesh]
# H_l = 1 and H_u = depth_ratio in solver units.
lx = 83.333333333
nominal_ceiling = 4.5
max_level = 11
min_level = 3
initial_level = 10
ceiling_fine_fraction = 0.975
ceiling_level_drop = 4
initial_adapt_passes = 8
interface_padding = 1
interface_epsilon = 1.0e-6

[time_integration]
end_time = 700.0
max_dt = 5.00e-2
cfl = 0.475
solver_tolerance = 5.0e-4
solver_nitermax = 256

[initial_condition]
perturbation_mode = 1
tracked_mode = 1
perturbation_phase = 0.0
velocity_amplitude = 0.0
lower_depth_amplitude = 0.0
upper_depth_amplitude = 0.05
# 1: hydrostatic pressure following perturbed interfaces; 0: base p(z).
pressure_mode = 1
initial_audit_warning_tolerance = 1.0e-5

[adaptation]
# All tolerances are dimensionless.
u_error_lower = 0.50
v_error_lower = 0.25
u_error_air = 1.50
v_error_air = 1.00
vorticity_error = 0.20
shear_error = 0.20

[output]
output_dt = 4.166666666666667
gfs_dt = 4.166666666666667
dump_dt = 100.0
enable_dump_output = true
wave_amplitude_every = 50

[profile_sampling]
lower_samples = 101
upper_samples = 101
air_samples = 101
integration_points = 1001

[dimensional_reference]
# Optional metadata for conversion of outputs. It does not enter the PDE.
enabled = false
gravity_m_s2 = 9.81
lower_depth_m = 0.025
lower_density_kg_m3 = 1500.0
