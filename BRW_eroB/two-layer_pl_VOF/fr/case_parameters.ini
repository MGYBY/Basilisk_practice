# Dimensionless three-phase two-layer power-law roll-wave case
#
# Reference scales:
#   length H_l; velocity U_l; time H_l/U_l; pressure rho_l U_l^2;
#   dynamic viscosity rho_l U_l H_l.
#
# Front runner: R_eta,I = eta_lower,I / eta_upper,I = 1.
# This convention is retained from the uploaded solver.
# The former hard viscosity caps are represented by the smooth low-shear
# plateaus used in the latest audited report.

[physical_problem]
froude_lower = 0.60
slope_tan = 0.06
depth_ratio = 1.0
density_ratio = 0.8
interfacial_apparent_viscosity_ratio = 1.0

air_density_ratio = 0.012
# R_mu,u/a = eta_u(gamma*=1)/eta_a; gamma*=1 represents U_l/H_l.
# The generator evaluates eta_u with the complete upper rheology and derives
# eta_a. The ratio is inherited; eta_a changes when the liquid rheology changes.
upper_to_air_dynamic_viscosity_ratio = 67.0
air_streamwise_gravity = false

# sigma_star = sigma/(rho_l U_l^2 H_l) = 1/We.
# Set both to zero to match the no-capillarity stability report.
sigma_internal_star = 1.0e-2
sigma_free_star = 1.0e-2

[lower_rheology]
# Available models: smooth_power_law, bounded_power_law,
# papanastasiou_hb, bounded_hb.
model = smooth_power_law
power_index = 0.4
epsilon = 2.0e-4
yield_stress_star = 0.0
papanastasiou_m_star = 0.0
eta_min = 0.0
eta_max = 50.0
gamma_floor = 1.0e-8

[upper_rheology]
model = smooth_power_law
power_index = 0.8
epsilon = 2.0e-4
yield_stress_star = 0.0
papanastasiou_m_star = 0.0
eta_min = 0.0
eta_max = 50.0
gamma_floor = 1.0e-8

[domain_and_mesh]
# H_l = 1 and H_u = depth_ratio in solver units.
lx_slope_scaled = 72.0  # S0 Lx/H_l; actual Lx/H_l = 72/slope_tan
nominal_ceiling = 6.50
max_level = 15
min_level = 3
initial_level = 12
ceiling_fine_fraction = 0.975
ceiling_level_drop = 4
initial_adapt_passes = 8
interface_padding = 1
interface_epsilon = 1.0e-6

[time_integration]
end_time = 1500.0
max_dt = 5.00e-2
cfl = 0.475
solver_tolerance = 5.0e-4
solver_nitermax = 256

[initial_condition]
perturbation_mode = 1
tracked_mode = 1
perturbation_phase = 0.0
velocity_amplitude = 0.0  # derived as sqrt(local depth factor), not an independent sinusoid
lower_depth_amplitude = 0.1
upper_depth_amplitude = 0.1
# 1: hydrostatic pressure following perturbed interfaces; 0: base p(z).
pressure_mode = 1
initial_audit_warning_tolerance = 1.0e-5

[adaptation]
# All tolerances are dimensionless.
u_error_lower = 1.20
v_error_lower = 1.2
u_error_air = 3.50
v_error_air = 3.00
vorticity_error = 0.80
shear_error = 0.80

[output]
output_dt = 25.0
gfs_dt = 25.0
dump_dt = 200.0
enable_dump_output = true
wave_amplitude_every = 56

[profile_sampling]
lower_samples = 201
upper_samples = 201
air_samples = 201
integration_points = 1001

[dimensional_reference]
# Optional metadata for conversion of outputs. It does not enter the PDE.
enabled = false
gravity_m_s2 = 9.81
lower_depth_m = 0.025
lower_density_kg_m3 = 1500.0

[front_runner]
enabled = true
# lambda is the full equivalent sine wavelength; occupied support = lambda/2.
wavelength_slope_scaled = 2.0
center_wavelengths = 0.75
# Preserve periodic boundaries; stop when material interfaces leave the
# steady reference near either seam. This can also flag base-state drift.
stop_before_wrap = false
boundary_guard_wavelengths = 0.25
boundary_guard_height = 0.01
